apply plugin: 'com.android.application'

// Release signing: CI provides ANDROID_KEYSTORE_* env vars; local release builds
// read android/keystore.properties (gitignored). Sideload updates require the
// SAME key forever — back the keystore up (see README).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProps.getProperty('storeFile')

android {
    namespace "info.chainlens.magicmoney"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "info.chainlens.magicmoney"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in sync with package.json by scripts/release.js
        versionCode 15
        versionName "0.7.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStorePath != null) {
                storeFile file(releaseStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds install beside the release wallet. This prevents a
            // local debug key from colliding with or replacing real wallet data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // minify off: the bundle is JS; R8 on the thin native shell saves
            // little and risks stripping plugin reflection paths.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// ── Magic Guard native engine (native/magic-guard-core, Rust → JNI) ──────────
// Cross-compiles the adblock engine cdylib into src/main/jniLibs before every
// build. Requires rustup targets aarch64-linux-android + x86_64-linux-android,
// cargo-ndk, and NDK 27.3.13750724 (see .github/workflows for the CI setup).
// If cargo is unavailable but the .so files already exist (e.g. a machine that
// only touches Java/JS), the build proceeds with the existing binaries.
def magicGuardCrateDir = file("$rootDir/../native/magic-guard-core")
def magicGuardJniLibs = file("$projectDir/src/main/jniLibs")
def magicGuardNdkVersion = '27.3.13750724'

def isWindows = System.getProperty('os.name').toLowerCase().contains('win')

def findCargo = {
    def candidates = []
    if (System.getenv('CARGO') != null) candidates << new File(System.getenv('CARGO'))
    def home = System.getProperty('user.home')
    candidates << new File(home, isWindows ? '.cargo\\bin\\cargo.exe' : '.cargo/bin/cargo')
    def found = candidates.find { it.exists() }
    if (found != null) return found.absolutePath
    return isWindows ? 'cargo.exe' : 'cargo' // hope it's on PATH
}

// Resolve the SDK dir without android.sdkDirectory (removed in newer AGP):
// local.properties sdk.dir → ANDROID_HOME → ANDROID_SDK_ROOT.
def resolveSdkDir = {
    def lp = rootProject.file('local.properties')
    if (lp.exists()) {
        def props = new Properties()
        lp.withInputStream { props.load(it) }
        def dir = props.getProperty('sdk.dir')
        if (dir != null && !dir.isEmpty()) return dir
    }
    return System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
}

tasks.register('buildMagicGuardCore', Exec) {
    workingDir magicGuardCrateDir
    // Resolve NDK lazily (execution time), so a stale/absent SDK config can't
    // break configuration of unrelated tasks.
    doFirst {
        def sdkDir = resolveSdkDir()
        if (sdkDir != null) environment 'ANDROID_HOME', sdkDir
        // Prefer an NDK path from the environment (CI's setup-ndk action);
        // otherwise fall back to the pinned r27 under the local SDK dir.
        def ndkHome = System.getenv('ANDROID_NDK_HOME')
        if ((ndkHome == null || ndkHome.isEmpty()) && sdkDir != null) {
            ndkHome = "$sdkDir/ndk/$magicGuardNdkVersion"
        }
        if (ndkHome != null) environment 'ANDROID_NDK_HOME', ndkHome
    }
    commandLine findCargo(), 'ndk',
            '-t', 'arm64-v8a', '-t', 'x86_64',
            '-o', magicGuardJniLibs.absolutePath,
            'build', '--release'
    onlyIf {
        def cargoPath = findCargo()
        def cargoExists = new File(cargoPath).isAbsolute() ? new File(cargoPath).exists() : true
        def soExists = new File(magicGuardJniLibs, 'arm64-v8a/libmagic_guard_core.so').exists()
        if (!cargoExists && soExists) {
            logger.warn('cargo not found — reusing existing prebuilt libmagic_guard_core.so')
            return false
        }
        if (!cargoExists) {
            throw new org.gradle.api.GradleException('cargo not found and no prebuilt libmagic_guard_core.so — install the Rust toolchain (see native/magic-guard-core)')
        }
        return true
    }
}
preBuild.dependsOn 'buildMagicGuardCore'

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // DappBrowserPlugin: addDocumentStartJavaScript + addWebMessageListener
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Lets the wallet act as a system passkey provider (Android 14+), so its
    // seed-derived passkeys work in Chrome/Brave/Samsung Internet — and, unlike
    // Samsung Pass, in the wallet's own browser too.
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    // The Java port of the frozen WebAuthn derivation spec. See variables.gradle
    // for why this is the lightweight API and not a JCE provider.
    implementation "org.bouncycastle:bcprov-jdk18on:$bouncyCastleVersion"
    // Embedded Tor runtime for Android. The previous arti-mobile AAR was built
    // without onion-service-client support, so .onion requests were rejected
    // after an ordinary Tor exit had already been verified. tor-android embeds
    // the maintained Tor daemon and supports both clearnet exits and v3 onions.
    implementation "info.guardianproject:tor-android:0.4.9.11"
    implementation "info.guardianproject:jtorctl:0.4.5.7"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The parity suite reads src/main/__fixtures__/webauthn-vectors.json.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Override capacitor.build.gradle's Java 21 compileOptions: tor-android
// 0.4.9.11's classes are compiled for Java 24 (class file version 68), so
// javac can't even read them at source/targetCompatibility 21. This block
// MUST come after the apply above (capacitor.build.gradle is regenerated by
// `cap sync` on every build — editing it directly does not stick).
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
