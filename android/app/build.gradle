apply plugin: 'com.android.application'

// Release signing: CI provides ANDROID_KEYSTORE_* env vars; local release builds
// read android/keystore.properties (gitignored). Sideload updates require the
// SAME key forever — back the keystore up (see README).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProps.getProperty('storeFile')

android {
    namespace "info.chainlens.magicmoney"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "info.chainlens.magicmoney"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in sync with package.json by scripts/release.js
        versionCode 5
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStorePath != null) {
                storeFile file(releaseStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds install beside the release wallet. This prevents a
            // local debug key from colliding with or replacing real wallet data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // minify off: the bundle is JS; R8 on the thin native shell saves
            // little and risks stripping plugin reflection paths.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // DappBrowserPlugin: addDocumentStartJavaScript + addWebMessageListener
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Embedded Tor runtime for Android. The previous arti-mobile AAR was built
    // without onion-service-client support, so .onion requests were rejected
    // after an ordinary Tor exit had already been verified. tor-android embeds
    // the maintained Tor daemon and supports both clearnet exits and v3 onions.
    implementation "info.guardianproject:tor-android:0.4.9.11"
    implementation "info.guardianproject:jtorctl:0.4.5.7"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Override capacitor.build.gradle's Java 21 compileOptions: tor-android
// 0.4.9.11's classes are compiled for Java 24 (class file version 68), so
// javac can't even read them at source/targetCompatibility 21. This block
// MUST come after the apply above (capacitor.build.gradle is regenerated by
// `cap sync` on every build — editing it directly does not stick).
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
