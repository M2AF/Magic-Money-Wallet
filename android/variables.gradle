ext {
    // 26+: sane Keystore/BiometricPrompt behavior and a modern WebView baseline
    // (addDocumentStartJavaScript is still feature-checked at runtime in Phase 3).
    minSdkVersion = 26
    // Compile against API 37 so the current embedded Tor Android runtime can
    // be consumed.
    //
    // targetSdk 36 (Android 16) is required by Play for app updates from
    // 2026-08-30. Behavior changes that switch on at 36 and how each lands here:
    //   • Edge-to-edge is no longer opt-out-able. Already absorbed at 35 (the
    //     theme never set windowOptOutEdgeToEdgeEnforcement) — insets are
    //     handled in capacitor/cap.css via env(safe-area-inset-*).
    //   • Predictive back is on by default: onBackPressed() is not called and
    //     KEYCODE_BACK is not dispatched. The JS `backButton` event is safe
    //     (@capacitor/app routes through OnBackPressedDispatcher), but the
    //     fullscreen-video handler in DappBrowserPlugin had to move off the raw
    //     key event — see ensureFullscreenContainer().
    //   • Orientation/resizability ignored on sw>=600dp: the manifest never
    //     constrained screenOrientation or resizableActivity, so no change.
    //   • elegantTextHeight ignored: the UI is a WebView; no native TextViews.
    compileSdkVersion = 37
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    // Credential Manager PROVIDER api (CredentialProviderService) — Android 14+
    // only, so the service is gated at runtime and simply never bound below 34.
    androidxCredentialsVersion = '1.5.0'
    // BouncyCastle LIGHTWEIGHT API only (org.bouncycastle.crypto.*), never
    // registered as a JCE Provider — Android already ships a stripped-down "BC"
    // provider and registering a second one is the classic source of silent
    // algorithm-resolution bugs. We need exactly two things the platform JCE
    // cannot do: P-256 scalar->point multiplication, and RFC 6979 deterministic
    // ECDSA (SunEC/Conscrypt pick a random k, which would break the frozen
    // signature vectors AND risk key disclosure from a weak RNG in a background
    // service).
    bouncyCastleVersion = '1.78.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
