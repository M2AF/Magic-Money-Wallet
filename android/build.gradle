// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // API 37 support is required by the current tor-android runtime.
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Guardian Project publishes the official experimental Arti Mobile AAR
        // here. Restrict the repository to that one artifact group.
        maven {
            url "https://raw.githubusercontent.com/guardianproject/gpmaven/master"
            content { includeGroup "org.torproject" }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
