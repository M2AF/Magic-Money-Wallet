name = "magicmoney-swap-proxy"
main = "swap-proxy.js"
compatibility_date = "2024-11-01"

# Bind a custom domain in the Cloudflare dashboard, e.g. api.magicmoneywallet.com
# routes = [{ pattern = "api.magicmoneywallet.com/*", custom_domain = true }]

# ── Cross-user cache (KV) ─────────────────────────────────────────────────────
# Create once, then paste the id below:
#   wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "91f84d4789c14f998fb0e3c1efdf5f75"

# ── Cron: global Market Watch refresh ─────────────────────────────────────────
# Refreshes the top-500 coin list into KV (market.js refreshTop500) so every
# user reads the same cached data. Every 15 min = 96 runs × 2 CoinGecko calls
# per day ≈ 5.8k/month — sized to fit the free demo key's 10k/month budget
# with headroom left for chart/search misses.
[triggers]
crons = ["*/15 * * * *"]

# ── Non-secret vars ───────────────────────────────────────────────────────────
# NOTE: SUPABASE_URL is set as a dashboard secret on this Worker, so it is NOT
# declared here (a [vars] entry of the same name would collide on deploy).
[vars]
# Production guardrails:
# - ALLOWED_ORIGIN must be a specific origin, not "*".
# - CLIENT_TOKEN must be set as a secret and match the wallet's public client tag.
# - CACHE must be bound for rate limits and replay protection.
# For local wrangler dev only, set ALLOW_INSECURE_DEV = "true".
# ALLOWED_ORIGIN = "https://magicmoneywallet.com"
# Optional per-IP rate limits (requests/min). Defaults: READ_RPM=600, DB_RPM=60,
# MARKET_RPM=120.
# READ_RPM = "600"
# DB_RPM = "60"
# MARKET_RPM = "120"
#
# ── Swap fee / monetization (non-secret: public receiving addresses + integrator)
# Fee in basis points (90 = 0.9%). Recipients are the chain the user spends FROM.
FEE_BPS = "90"
FEE_EVM = "0x01faF6DFc230d755141D84d7cB980dd68f5Efe13"
FEE_SOLANA = "3noTuHnQdHkat2w5rBx18vAACMzFUvB5LodEe5vMN98d"
FEE_CARDANO = "addr1q950qv0ks9t29mavulaa5jr3sk2s50r5jfsddydjs0pazrfh32tdpt7zttt4mhl6t9purm4c9rv555z7r5mulq78aleqcg9c9h"
FEE_BITCOIN = "bc1qt6cx7977r8xttn5rg42d2ulnlc7agspycd600w"
FEE_POLKADOT = "1dhUhWA8DZEbT5GmjXTJBuafJGWtS5YH13Wqz46KtFdDyoS"
# LI.FI integrator string — registered at portal.li.fi as "ChainLens" (fee receivers
# configured there; EVM fees auto-forward to the receiver as of the 8 Apr 2026 update).
LIFI_INTEGRATOR = "ChainLens"
# 1inch referrer defaults to FEE_EVM when unset:
# ONEINCH_REFERRER = "0x01faF6DFc230d755141D84d7cB980dd68f5Efe13"

# ── Secrets (NEVER stored here) ───────────────────────────────────────────────
# Set with wrangler so keys never enter source. Use ROTATED keys — the old ones
# shipped in the client bundle and are considered burned.
#
# Swap (existing):
#   wrangler secret put ZEROX_API_KEY
#   wrangler secret put ONEINCH_API_KEY
#   wrangler secret put JUPITER_API_KEY        # optional
#   wrangler secret put LIFI_API_KEY           # optional — routing is keyless; key only raises rate limits
#   wrangler secret put SIMPLESWAP_API_KEY
#   wrangler secret put UNISWAP_API_KEY            # Uniswap Trading API (uniswapQuote, same-chain EVM best-price)
#     ⚠ portion fee (portionBips/portionRecipient) is IGNORED until Uniswap Labs enables
#       fee-taking on the key — contact them; the code already sends it so it auto-activates.
#
# Swap (cross-chain + fees):
#   wrangler secret put RANGO_API_KEY              # cross-chain fallback / exotic chains
#   wrangler secret put SWAPKIT_API_KEY            # THORChain/Maya/Chainflip — native BTC routes
#   wrangler secret put CHANGENOW_API_KEY          # deposit-address fallback (covers Polkadot/DOT)
#   wrangler secret put JUPITER_REFERRAL_ACCOUNT   # optional — Jupiter platform fee skipped when unset
#   # FEE_* + LIFI_INTEGRATOR live in [vars] above (public). Override there as secrets if preferred.
#
# Read-path (new):
#   wrangler secret put ALCHEMY_KEY
#   wrangler secret put ANKR_API_KEY          # keyed RPC fallback (Ankr deprecated keyless)
#   wrangler secret put HELIUS_KEY
#   wrangler secret put TATUM_KEY
#   wrangler secret put BLOCKFROST_KEY
#   wrangler secret put MORALIS_KEY
#   wrangler secret put OPENSEA_KEY
#   wrangler secret put ORDISCAN_API_KEY       # Bitcoin Ordinals/Runes/BRC-20 (Ordiscan)
#
# Market Watch (market.js — optional; keyless works but shares Cloudflare egress IPs):
#   wrangler secret put COINGECKO_KEY           # demo (CG- prefix) or pro key
#   wrangler secret put COINMARKETCAP_API_KEY   # authenticated fallback for top/search/chart
#
# Supabase (new — service-role key, server-side only):
#   wrangler secret put SUPABASE_SERVICE_KEY
#
# Optional client gate (filters drive-by abuse; the client sends it as x-mm-client):
#   wrangler secret put CLIENT_TOKEN  # value must match clientToken in wallet config
