<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Dev-mode CSP baseline. This loose policy exists so Vite's HMR websocket and
      react-refresh inline script work during `npm run dev`. In the PACKAGED app a
      much stricter Content-Security-Policy is injected as a response header in the
      main process (WALLET_CSP in src/main/index.ts) — script-src 'self' (no inline)
      and connect-src locked to 'self' + the proxy. The browser enforces every
      delivered policy, so the prod header tightens this baseline to the strict set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss: ws:; img-src 'self' data: https: ipfs: ar:; script-src 'self' 'unsafe-inline'"
    />
    <title>Magic Money Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
