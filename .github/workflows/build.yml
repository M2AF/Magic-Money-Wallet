name: Build (manual)

# On-demand cross-platform build WITHOUT publishing a release. Use this to verify
# that Windows, macOS and Linux all package successfully and to download the
# installers as workflow artifacts — handy when you don't own a Mac/Linux machine.
# Trigger it from the Actions tab → "Build (manual)" → "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package (no publish)
        env:
          # No Apple Developer cert in CI → don't try to auto-discover one (it would
          # fail). electron-builder ad-hoc signs the .app so it still runs locally.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: warn
