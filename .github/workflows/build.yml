name: Build (manual)

# On-demand cross-platform build WITHOUT publishing a release. Use this to verify
# that Windows, macOS and Linux all package successfully and to download the
# installers as workflow artifacts — handy when you don't own a Mac/Linux machine.
# Trigger it from the Actions tab → "Build (manual)" → "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so every job that runs npm ci needs a pinned toolchain
      # first (matching node_modules/adblock-rs's own rust-toolchain.toml channel).
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      - name: Package (no publish)
        env:
          # No Apple Developer cert in CI → don't try to auto-discover one (it would
          # fail). electron-builder ad-hoc signs the .app so it still runs locally.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish never: electron-builder auto-publishes when it detects CI + a
        # publish config; this is a build-only workflow (no token), so opt out.
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Upload installers
        # always() so we still collect whatever built even if one sub-target fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: warn

  # ── Android APK (no publish) — same signing path as the release workflow, so
  # this doubles as the way to verify the ANDROID_KEYSTORE_* secrets work.
  android:
    runs-on: ubuntu-latest
    name: Build (Android)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 24, not 21: tor-android 0.4.9.11's classes are compiled for Java 24
          # (class file version 68) — app/build.gradle overrides Capacitor's
          # generated compileOptions to VERSION_24 to match.
          java-version: 24

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so npm ci needs a pinned toolchain first even though
      # this job only builds the Capacitor bundle (npm ci installs ALL declared
      # dependencies, not just the ones a given build script touches). The same
      # toolchain also cross-compiles the Android Magic Guard native engine
      # (native/magic-guard-core → jniLibs) via the Gradle buildMagicGuardCore task.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # Android NDK for the Magic Guard cdylib cross-compile. Pin r27 (LTS) to
      # match the local dev toolchain in android/app/build.gradle.
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
        id: setup-ndk

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + sync
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run build:capacitor

      - name: Build APK
        shell: bash
        env:
          # buildMagicGuardCore (android/app/build.gradle) cross-compiles the
          # native engine during assemble — cargo-ndk needs the NDK path here.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          # The android/ project is maintained from Windows — make sure the
          # wrapper is executable even if a future commit drops the mode bit.
          chmod +x ./gradlew
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > magicmoney-release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/magicmoney-release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/magicmoney-android.apk"
            # AAB (upload-key signed) — what Google Play Console accepts.
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/magicmoney-android.aab"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — building debug-signed APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/magicmoney-android-debugsigned.apk"
          fi

      - name: Upload APK + AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-Android
          path: |
            magicmoney-android*.apk
            magicmoney-android*.aab
          if-no-files-found: warn
