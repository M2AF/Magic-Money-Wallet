name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so every job that runs npm ci needs a pinned toolchain
      # first (matching node_modules/adblock-rs's own rust-toolchain.toml channel).
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # xvfb: the real-extension specs need a HEADED Chromium (unpacked MV3
        # extensions don't load in classic headless), and Linux runners have no
        # display server — give them a virtual one.
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # ── Create the draft release every builder uploads into ────────────────────
  # Exactly ONE job creates the release, before any builder runs. This kills
  # two failure modes at once:
  #   • v0.2.0-beta.2: the three electron-builder legs raced to CREATE the
  #     release; the slowest leg 422'd on its own create after a faster leg won.
  #   • Stable-tag landmine (never yet hit): electron-builder only uploads into
  #     draft/prerelease releases. On a stable tag the slower legs would find
  #     the already-PUBLISHED release and silently SKIP their uploads — green
  #     CI, missing installers.
  # The release stays a DRAFT (invisible to watchers, electron-updater, and the
  # Android update check) until publish-release flips it at the very end, after
  # verifying every expected asset is present.
  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    name: Prepare Release (draft)

    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Idempotent: a full re-run finds the existing release and moves on.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes \
              --title "$TAG"
          fi

  # ── Build Electron app for all three platforms ─────────────────────────────
  electron:
    needs: [validate, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Electron (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so every job that runs npm ci needs a pinned toolchain
      # first (matching node_modules/adblock-rs's own rust-toolchain.toml channel).
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert configured → skip identity auto-discovery so the
          # macOS build doesn't fail looking for one (it ad-hoc signs instead).
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        # releaseType=draft: prepare-release already created the draft for this
        # tag; electron-builder finds it by tag and uploads into it (drafts
        # always accept uploads — published stable releases don't). Do NOT
        # switch this to prerelease/release: that reintroduces the silent-skip
        # landmine on stable tags. publish-release owns the final flags.
        # Retry: covers transient upload failures (the creation race is gone).
        run: |
          npm run build
          for attempt in 1 2 3; do
            npx electron-builder --publish always --config.publish.releaseType=draft && exit 0
            echo "::warning::electron-builder publish failed (attempt $attempt) — retrying in 30s"
            sleep 30
          done
          exit 1

  # ── Build Android APK + AAB ─────────────────────────────────────────────────
  # Uploads into the draft created by prepare-release (gh CLI resolves draft
  # releases by tag — the softprops action could not, which is why the old
  # workflow had to run after the electron matrix; that ordering is now gone).
  # Signing: with the ANDROID_KEYSTORE_* secrets set, produces a release-signed
  # APK (REQUIRED for update-over-install to keep working between versions).
  # Without them it falls back to a debug-signed APK marked "-debugsigned"
  # (installable for testing, but each CI run signs with a throwaway key, so
  # updates need uninstall/reinstall). Note: the debug fallback produces no
  # AAB, so publish-release's completeness gate will fail and the release
  # stays draft — a debug-signed build must never publish.
  android:
    needs: [validate, prepare-release]
    runs-on: ubuntu-latest
    name: Android APK

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 24, not 21: tor-android 0.4.9.11's classes are compiled for Java 24
          # (class file version 68) — app/build.gradle overrides Capacitor's
          # generated compileOptions to VERSION_24 to match; javac needs a
          # matching-or-newer JDK to even read those class files.
          java-version: 24

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so npm ci needs a pinned toolchain first even though
      # this job only builds the Capacitor bundle (npm ci installs ALL declared
      # dependencies, not just the ones a given build script touches). The same
      # toolchain also cross-compiles the Android Magic Guard native engine
      # (native/magic-guard-core → jniLibs) via the Gradle buildMagicGuardCore task.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # Android NDK for the Magic Guard cdylib cross-compile. Pin r27 (LTS) to
      # match the local dev toolchain in android/app/build.gradle.
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
        id: setup-ndk

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + sync
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run build:capacitor

      - name: Build APK
        shell: bash
        env:
          # buildMagicGuardCore (android/app/build.gradle) cross-compiles the
          # native engine during assemble — cargo-ndk needs the NDK path here.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          # The android/ project is maintained from Windows — make sure the
          # wrapper is executable even if a future commit drops the mode bit.
          chmod +x ./gradlew
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > magicmoney-release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/magicmoney-release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk \
               "$GITHUB_WORKSPACE/magicmoney-android-${{ github.ref_name }}.apk"
            # AAB (upload-key signed) — what Google Play Console accepts.
            cp app/build/outputs/bundle/release/app-release.aab \
               "$GITHUB_WORKSPACE/magicmoney-android-${{ github.ref_name }}.aab"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — building debug-signed APK (updates will require uninstall/reinstall)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk \
               "$GITHUB_WORKSPACE/magicmoney-android-${{ github.ref_name }}-debugsigned.apk"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(magicmoney-android-*.apk magicmoney-android-*.aab)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # ── Build Chrome extension zip (runs once on Linux) ────────────────────────
  extension:
    needs: [validate, prepare-release]
    runs-on: ubuntu-latest
    name: Chrome Extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so npm ci needs a pinned toolchain first even though
      # this job only builds the extension (npm ci installs ALL declared
      # dependencies, not just the ones a given build script touches).
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:extension

      - name: Zip extension
        run: |
          cd dist-extension
          zip -r ../magicmoney-extension-${{ github.ref_name }}.zip .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "magicmoney-extension-$TAG.zip" --clobber --repo "$GITHUB_REPOSITORY"

  # ── iOS: unsigned .ipa for sideloading ─────────────────────────────────────
  # MagicMoney is not distributed through the App Store — by choice, and there
  # is no paid Apple Developer membership. The release asset is an UNSIGNED
  # .ipa; users install it with Sideloadly or AltStore on Windows/macOS, which
  # re-signs the app and its embedded frameworks with the user's own free Apple
  # ID. No certificate, no provisioning profile and no Apple account are needed
  # to produce this artifact, which is why this job needs no secrets.
  #
  # Free-provisioning installs expire after 7 days and must be re-signed; that
  # is a property of the user's install, not of this build.
  ios:
    needs: [validate, prepare-release]
    runs-on: macos-14
    name: iOS (.ipa)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs compiles from Rust source during npm ci (see the notes on the
      # other jobs) — unused here, but npm ci installs every declared dependency.
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      - name: Scaffold ios/ if absent
        run: |
          if [ ! -d ios ]; then
            echo "::notice::ios/ not committed yet — generating from the Capacitor template"
            node scripts/cap.js add ios
          fi

      - name: Generate app icons
        run: npm run icons:ios

      - name: Build web bundle + sync
        run: npm run build:ios

      - name: Build device .ipa (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild-device.log

          APP="build/ios-device/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Device build produced no App.app at $APP"
            exit 1
          fi
          # .ipa is a zip with the app under Payload/ — the standard unsigned
          # layout that re-signing tools accept.
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "magicmoney-ios-${{ github.ref_name }}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh magicmoney-ios-*.ipa

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "magicmoney-ios-$TAG-unsigned.ipa" --clobber --repo "$GITHUB_REPOSITORY"

  # ── Verify completeness, then publish atomically ───────────────────────────
  # Runs only if EVERY build job succeeded. Checks that all expected assets
  # actually landed on the draft (a leg can succeed while an upload silently
  # didn't stick), then flips draft → published. Auto-update clients never see
  # a half-uploaded release. If this job fails or is skipped, the release
  # stays draft — fix and use "Re-run failed jobs" to resume.
  publish-release:
    needs: [prepare-release, electron, android, extension, ios]
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          echo "$assets"
          missing=0
          for pattern in \
            'Setup.*\.exe$' \
            '\.dmg$' \
            '-mac\.zip$' \
            '\.AppImage$' \
            '\.deb$' \
            '^latest\.yml$' \
            '^latest-mac\.yml$' \
            '^latest-linux\.yml$' \
            '^magicmoney-android-.*\.apk$' \
            '^magicmoney-android-.*\.aab$' \
            '^magicmoney-extension-.*\.zip$' \
            '^magicmoney-ios-.*-unsigned\.ipa$'
          do
            # '--': some patterns start with '-' (e.g. -mac\.zip$) and grep
            # would otherwise parse them as options.
            if ! echo "$assets" | grep -qE -- "$pattern"; then
              echo "::error::Missing release asset matching: $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release stays DRAFT — asset set incomplete."
            exit 1
          fi
          # A '-' in the tag means beta → GitHub Pre-release; otherwise it's a
          # stable release and becomes the repo's Latest.
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published $TAG"
