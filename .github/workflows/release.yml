name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # ── Build Electron app for all three platforms ─────────────────────────────
  electron:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Electron (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert configured → skip identity auto-discovery so the
          # macOS build doesn't fail looking for one (it ad-hoc signs instead). When
          # you add real signing later, set CSC_LINK / CSC_KEY_PASSWORD secrets and
          # drop this line.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package:publish

  # ── Build Chrome extension zip (runs once on Linux) ────────────────────────
  extension:
    needs: validate
    runs-on: ubuntu-latest
    name: Chrome Extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:extension

      - name: Zip extension
        run: |
          cd dist-extension
          zip -r ../magicmoney-extension-${{ github.ref_name }}.zip .

      - name: Upload extension zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: magicmoney-extension-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
