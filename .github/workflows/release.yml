name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # xvfb: the real-extension specs need a HEADED Chromium (unpacked MV3
        # extensions don't load in classic headless), and Linux runners have no
        # display server — give them a virtual one.
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # ── Build Electron app for all three platforms ─────────────────────────────
  electron:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Electron (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert configured → skip identity auto-discovery so the
          # macOS build doesn't fail looking for one (it ad-hoc signs instead). When
          # you add real signing later, set CSC_LINK / CSC_KEY_PASSWORD secrets and
          # drop this line.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Prerelease tags (v0.2.0-beta.1) publish as a visible GitHub Pre-release;
          # stable tags publish as a normal release. electron-builder's default
          # (draft) is incompatible with the extension job appending its zip — a
          # draft can't be found by tag, so the zip upload would fork a second
          # release for the same tag (the v0.2.0-beta.1 maiden-run bug).
          RELEASE_TYPE: ${{ contains(github.ref_name, '-') && 'prerelease' || 'release' }}
        shell: bash
        run: npm run build && npx electron-builder --publish always --config.publish.releaseType="$RELEASE_TYPE"

  # ── Build Android APK (sideload) ───────────────────────────────────────────
  # Same invariant as the extension job: electron-builder owns creating the
  # GitHub release; this job only appends the APK to it, so it MUST run after
  # the electron matrix (the v0.2.0-beta.1 maiden-run bug).
  # Signing: with the ANDROID_KEYSTORE_* secrets set, produces a release-signed
  # APK (REQUIRED for update-over-install to keep working between versions).
  # Without them it falls back to a debug-signed APK marked "-debugsigned"
  # (installable for testing, but each CI run signs with a throwaway key, so
  # updates need uninstall/reinstall — add the secrets before real releases).
  android:
    needs: [validate, electron]
    runs-on: ubuntu-latest
    name: Android APK

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + sync
        run: npm run build:capacitor

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          # The android/ project is maintained from Windows — make sure the
          # wrapper is executable even if a future commit drops the mode bit.
          chmod +x ./gradlew
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > magicmoney-release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/magicmoney-release.keystore"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk \
               "$GITHUB_WORKSPACE/magicmoney-android-${{ github.ref_name }}.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — building debug-signed APK (updates will require uninstall/reinstall)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk \
               "$GITHUB_WORKSPACE/magicmoney-android-${{ github.ref_name }}-debugsigned.apk"
          fi

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: magicmoney-android-*.apk
          # Keep the flag electron-builder set — a '-' in the tag means beta.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build Chrome extension zip (runs once on Linux) ────────────────────────
  # MUST run after the electron matrix: electron-builder owns creating the
  # GitHub release; this job only appends the zip to it. When this ran in
  # parallel it created the release first and electron-builder refused to
  # upload the installers into it (exit 0, empty release).
  extension:
    needs: [validate, electron]
    runs-on: ubuntu-latest
    name: Chrome Extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:extension

      - name: Zip extension
        run: |
          cd dist-extension
          zip -r ../magicmoney-extension-${{ github.ref_name }}.zip .

      - name: Upload extension zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: magicmoney-extension-${{ github.ref_name }}.zip
          # Keep the flag electron-builder set — a '-' in the tag means beta.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
