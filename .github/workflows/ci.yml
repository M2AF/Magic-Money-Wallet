name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gate every push/PR on the crypto-critical safety net: types must check, and
  # the derivation / vault / signing-disclosure unit tests must pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so every job that runs npm ci needs a pinned toolchain
      # first (matching node_modules/adblock-rs's own rust-toolchain.toml channel).
      - uses: dtolnay/rust-toolchain@1.97
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Linux CI covers typecheck, unit tests and the EXTENSION e2e specs. The desktop
      # (Electron) specs drive a Windows electron.exe and self-skip here because
      # out/main does not exist yet — keep e2e BEFORE any desktop build. They are
      # covered locally by `npm run verify:ci` on Windows (see AGENTS.md).
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: E2E tests (extension)
        # xvfb: unpacked MV3 extensions need a HEADED Chromium and the runner has no
        # display. One worker: the software-WebGL theme specs starve under parallel load.
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --workers=1
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
      # Screenshots and traces of failing specs: without them a Linux-only e2e
      # failure shows up as a bare "Test timeout exceeded" in the log.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
