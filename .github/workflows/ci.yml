name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gate every push/PR on the crypto-critical safety net: types must check, and
  # the derivation / vault / signing-disclosure unit tests must pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # adblock-rs (Magic Guard) has no prebuilt binaries — it compiles from Rust
      # source on install, so every job that runs npm ci needs a pinned toolchain
      # first (matching node_modules/adblock-rs's own rust-toolchain.toml channel).
      - uses: dtolnay/rust-toolchain@1.97
      - run: npm ci
      - name: Type check (main + renderer)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        # xvfb: the real-extension specs need a HEADED Chromium (unpacked MV3
        # extensions don't load in classic headless), and Linux runners have no
        # display server — give them a virtual one.
        run: xvfb-run --auto-servernum -- npm run test:e2e
      # Screenshots and traces of failing specs: without them a Linux-only e2e
      # failure shows up as a bare "Test timeout exceeded" in the log.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - name: Build
        run: npm run build
