name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gate every push/PR on the crypto-critical safety net: types must check, and
  # the derivation / vault / signing-disclosure unit tests must pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check (main + renderer)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        # xvfb: the real-extension specs need a HEADED Chromium (unpacked MV3
        # extensions don't load in classic headless), and Linux runners have no
        # display server — give them a virtual one.
        run: xvfb-run --auto-servernum -- npm run test:e2e
      - name: Build
        run: npm run build
