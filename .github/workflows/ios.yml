name: iOS

# THE ONLY PLACE iOS CODE IS EVER COMPILED.
#
# This project is developed on Windows and the team owns no Mac, so there is no
# local Xcode, no local Simulator, and no way to check a Swift change before
# pushing. That makes this workflow the entire feedback loop for the iOS target:
# treat a red run as a broken build, and never mark iOS work "done" without a
# green one.
#
# It runs on every push and PR (not workflow_dispatch like build.yml) precisely
# because of that — unverified Swift must not accumulate. It deliberately does
# NOT reuse build.yml, which would drag three Electron installers and the
# Android APK along with every iOS check.
#
# Unsigned, simulator-only (CODE_SIGNING_ALLOWED=NO, -sdk iphonesimulator), so
# it needs no Apple Developer account, no certificate and no provisioning
# profile. Signed archive + TestFlight upload land in release.yml once the
# account exists — see the iOS plan, Phase 4.

on:
  push:
    branches: [main]
    paths:
      - 'src/ios/**'
      - 'src/capacitor/**'
      - 'src/renderer/**'
      - 'src/main/**'
      - 'src/extension/**'
      - 'ios-plugins/**'
      - 'ios/**'
      - 'vite.ios.config.ts'
      - 'vite.capacitor.shared.ts'
      - 'capacitor.config.ts'
      - 'tsconfig.ios.json'
      - 'scripts/cap.js'
      - 'scripts/patch-ios-*.js'
      - 'scripts/generate-ios-icons.js'
      - 'package.json'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    name: Build (iOS)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # adblock-rs has no prebuilt binaries and compiles from Rust source during
      # npm ci. This job never uses it (Magic Guard on iOS is WKContentRuleList,
      # not the Rust engine), but npm ci installs ALL declared dependencies.
      - uses: dtolnay/rust-toolchain@1.97

      - name: Install dependencies
        run: npm ci

      # The ios/ project is generated rather than committed while the port is in
      # progress: `cap add ios` runs CocoaPods, which needs macOS, so it cannot
      # be produced on the Windows dev machine. Once the generated tree is
      # committed this step becomes a no-op and Xcode settings survive.
      - name: Scaffold ios/ if absent
        run: |
          if [ ! -d ios ]; then
            echo "::notice::ios/ not committed yet — generating from the Capacitor template"
            node scripts/cap.js add ios
          fi

      - name: Generate app icons
        run: npm run icons:ios

      - name: Build web bundle + sync
        run: npm run build:ios

      # Prove the local pod was actually wired in. Without this, a Podfile-patch
      # failure produces a perfectly green build in which none of our Swift was
      # ever compiled — the single most misleading outcome available here.
      - name: Verify the MagicMoneyPlugins pod is installed
        run: |
          if ! grep -q 'MagicMoneyPlugins' ios/App/Podfile; then
            echo "::error::Podfile does not reference MagicMoneyPlugins — patch-ios-native.js failed."
            exit 1
          fi
          # Capacitor's template pins iOS 14.0, which cannot resolve
          # GoogleMLKit/BarcodeScanning 7.0.0 (needs 15.5+) — that exact failure
          # broke the first real build. Assert the patch actually landed so a
          # future template change fails here with a clear message instead of
          # deep inside CocoaPods dependency resolution.
          if ! grep -q "platform :ios, '17.0'" ios/App/Podfile; then
            echo "::error::Podfile platform is not iOS 17.0 — patch-ios-native.js did not apply."
            grep -n 'platform :ios' ios/App/Podfile
            exit 1
          fi
          if [ ! -d ios/App/Pods/MagicMoneyPlugins ] && ! grep -q 'MagicMoneyPlugins' ios/App/Podfile.lock; then
            echo "::error::pod install did not resolve MagicMoneyPlugins."
            exit 1
          fi
          echo "Podfile + lock reference the local pod:"
          grep -n 'MagicMoneyPlugins' ios/App/Podfile ios/App/Podfile.lock || true

      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      # Compiling the pod is not the same as compiling OUR files: a glob typo
      # yields an empty-but-valid pod. Assert each plugin was actually built.
      - name: Verify every Swift plugin compiled
        run: |
          missing=0
          for f in AppInfoPlugin DownloaderPlugin SecureVaultPlugin DappBrowserPlugin MagicGuard; do
            if grep -q "$f.swift" xcodebuild.log; then
              echo "  ✓ $f.swift compiled"
            else
              echo "::error::$f.swift never appeared in the build log — the podspec source_files glob is not matching."
              missing=1
            fi
          done
          exit $missing

      # Boot a simulator and confirm the app actually launches. A successful
      # compile says nothing about whether the WebView loaded the bundle or
      # whether the custom plugins linked — both fail silently at runtime.
      # Device selection lives in its own step so the UDID is available to every
      # later step (smoke test, Face ID enrollment, Appium) via $IOS_UDID —
      # a shell variable set inside one `run:` block does not survive to the next.
      - name: Boot simulator
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          echo "IOS_UDID=$DEVICE" >> "$GITHUB_ENV"
          # Record the runtime version so Appium can pin platformVersion.
          VER=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(k for k,v in d.items() for x in v if x['udid']=='$DEVICE'))" \
            | sed -E 's/.*iOS-([0-9]+)-([0-9]+).*/\1.\2/')
          echo "IOS_PLATFORM=$VER" >> "$GITHUB_ENV"
          echo "Runtime: $VER"

      - name: Smoke test on simulator
        run: |
          set -e
          DEVICE="$IOS_UDID"

          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app

          # Route WebKit page messages (console.log / JS exceptions) into the
          # system log as well. The app reads this key from its OWN preferences
          # domain, so it must be written there.
          xcrun simctl spawn "$DEVICE" defaults write info.chainlens.magicmoney \
            WebKitDebugLogsPageMessagesToSystemConsoleEnabled -bool YES || true

          # os_log stream: native-side signals (plugin registration, WebView).
          xcrun simctl spawn "$DEVICE" log stream --level debug \
            --predicate 'processImagePath CONTAINS "App"' > simulator.log 2>&1 &
          LOG_PID=$!

          # THE important one. Capacitor's CAPLog (and therefore every JS
          # console.log / uncaught error forwarded by native-bridge.js) is
          # emitted with Swift `print()`, i.e. to the process's STDOUT — which
          # os_log does NOT capture. That is why the first blank-screen failure
          # produced no JS diagnostics at all. --console-pipe attaches to the
          # app's stdout/stderr, so this file is where a startup exception
          # actually shows up.
          xcrun simctl launch --console-pipe "$DEVICE" info.chainlens.magicmoney \
            > app-console.log 2>&1 &
          APP_PID=$!

          sleep 25

          # ORDER MATTERS: screenshot BEFORE detaching. `--console-pipe` keeps
          # simctl attached to the app, so killing that process also terminates
          # the app — screenshotting afterwards captured the iOS home screen and
          # made a perfectly healthy build look like a render failure.
          xcrun simctl io "$DEVICE" screenshot ios-launch.png

          # Prove the app was actually frontmost when the screenshot was taken,
          # so "app died / never foregrounded" can never again be mistaken for
          # "app rendered nothing".
          if ! xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -q "info.chainlens.magicmoney"; then
            echo "::error::App was not running when the screenshot was taken."
            exit 1
          fi

          kill $LOG_PID $APP_PID 2>/dev/null || true

      # The first version of this step only grepped for a handful of error
      # strings and PASSED a build whose screen was completely blank. Absence of
      # a known error message is not evidence the app rendered — so the
      # authoritative check here is the SCREENSHOT ITSELF.
      - name: Assert the app booted and rendered
        run: |
          echo "── app stdout (Capacitor + JS console) ──"
          cat app-console.log || echo "(no app-console.log)"
          echo
          echo "── native log highlights ──"
          grep -aiE "capacitor|webview|plugin|error|fatal" simulator.log | head -40 || true

          if grep -qaiE "Unable to open|Failed to load webpage|WebPageProxy.*crash" simulator.log; then
            echo "::error::The WebView failed to load the bundle — check webDir/cap sync."
            exit 1
          fi
          for plugin in AppInfo Downloader SecureVault DappBrowser; do
            if grep -qai "Unimplemented.*$plugin\|$plugin.*not implemented" simulator.log app-console.log; then
              echo "::error::Plugin $plugin did not register — check the -ObjC flag or the podspec glob."
              exit 1
            fi
          done
          # Uncaught JS at startup is the most likely cause of a blank render.
          if grep -qaE "Uncaught|ReferenceError|TypeError:|SyntaxError|Unhandled Promise" app-console.log; then
            echo "::error::Uncaught JavaScript error during startup (see app stdout above)."
            exit 1
          fi

      # Pixel-level proof that something actually rendered. A React app that
      # threw during boot leaves a uniform background — which is exactly what
      # shipped as "green" once already.
      - name: Assert the screen is not blank
        run: |
          # A venv, not `pip install` directly: the runner's python3 is
          # Homebrew-managed and refuses with "error: externally-managed-environment".
          python3 -m venv /tmp/pyenv
          /tmp/pyenv/bin/pip install --quiet --disable-pip-version-check pillow
          /tmp/pyenv/bin/python - <<'PY'
          import sys
          from PIL import Image

          im = Image.open("ios-launch.png").convert("RGB")
          w, h = im.size
          # Ignore the status bar (clock/wifi/battery always draw) and the home
          # indicator, or every blank screen looks "non-empty".
          body = im.crop((0, int(h * 0.08), w, int(h * 0.96)))
          colors = body.getcolors(maxcolors=1_000_000) or []
          distinct = len(colors)
          total = body.size[0] * body.size[1]
          dominant = max((c for c, _ in colors), default=total)
          share = dominant / total

          print(f"body {body.size}  distinct_colors={distinct}  dominant_share={share:.4f}")

          # Calibrated against the real failure: a non-rendering WebView gives
          # EXACTLY 1 distinct colour at 100% (the native background showing
          # through). Anything that painted — even a bare "Loading…" label —
          # produces hundreds of colours from text antialiasing.
          #
          # dominant_share is deliberately NOT a hard failure: this app's UI is
          # very dark, and a sparse-but-correct screen legitimately sits above
          # 0.99. Failing on it would block good builds; the colour count is the
          # signal that actually discriminates.
          if distinct < 12:
              print("::error::App window is blank — the UI did not render.")
              sys.exit(1)
          if share > 0.999:
              print("::warning::Screen is almost entirely one colour — check the screenshot artifact.")
          print("Screen rendered content.")
          PY

      # ── Functional end-to-end on the simulator ──────────────────────────────
      # This is the ONLY functional test the iOS build will ever get: nobody on
      # the project owns an Apple device, so there is no manual QA pass to fall
      # back on. Runner minutes are free on a public repo — use them.
      #
      # Drives the real app through Appium/XCUITest, switching into the WebView
      # to exercise window.wallet.* directly. That is what actually covers the
      # Swift plugins (SecureVault, AppInfo) — a screenshot can't.
      - name: Install Appium + XCUITest driver
        run: |
          # Versions are pinned, like every other toolchain here (rust 1.97,
          # adblock-rs 0.13.2), because CI is the only place iOS runs — a silent
          # upstream bump would surface as an unexplained red build.
          #
          # MUST be Appium 3: appium-xcuitest-driver has required server
          # `^3.0.0-rc.2` since v11.17, so pinning appium@2 fails at install with
          # "cannot be installed because the server version it requires ... does
          # not meet the currently installed one".
          npm install -g appium@3.6.0
          appium driver install xcuitest@12.1.4
          npm install --no-save webdriverio@9
          appium --version
          appium driver list --installed

      - name: Enroll Face ID on the simulator
        run: |
          # The simulator supports biometrics via darwin notifications. Without
          # this, LAContext reports "No identities are enrolled" and the whole
          # SecureVaultPlugin path is untestable — which is exactly what made
          # Face ID look like it needed real hardware.
          xcrun simctl spawn "$IOS_UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1
          xcrun simctl spawn "$IOS_UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged
          echo "Face ID enrolled on $IOS_UDID"

      - name: Run iOS end-to-end
        env:
          IOS_APP_PATH: build/ios/Build/Products/Debug-iphonesimulator/App.app
          SHOT_DIR: ios-shots
        run: |
          appium --port 4723 --log appium.log &
          APPIUM_PID=$!
          # Wait for readiness rather than sleeping a fixed amount.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4723/status >/dev/null && break
            sleep 1
          done
          set +e
          node scripts/ios-e2e.mjs
          STATUS=$?
          set -e
          kill $APPIUM_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-ios-e2e
          path: |
            ios-shots/
            appium.log
          if-no-files-found: warn

      # The SIMULATOR build, zipped. Not installable on a phone — this is what
      # Appetize.io wants if you ever need to poke at the app by hand in a
      # browser (their free tier is 30 min/month, public apps only). The .ipa
      # below is the device build and is NOT interchangeable with it.
      - name: Package simulator .app (for browser-based simulators)
        if: always()
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/magicmoney-ios-simulator.zip" App.app
          ls -lh "$GITHUB_WORKSPACE/magicmoney-ios-simulator.zip"

      - name: Upload simulator .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-ios-simulator-app
          path: magicmoney-ios-simulator.zip
          if-no-files-found: warn

      # ── Device build → unsigned .ipa for sideloading ────────────────────────
      # The simulator .app above CANNOT run on a real iPhone (different CPU
      # slice and no code signature). This produces a device build instead,
      # packaged as an unsigned .ipa.
      #
      # Unsigned is deliberate and is what sideloading tools expect: Sideloadly
      # and AltStore re-sign the .ipa (app + embedded frameworks) with the
      # user's own FREE Apple ID on their PC. That means no Apple Developer
      # Program membership and no Mac anywhere in the loop — Sideloadly runs on
      # Windows, which is the whole dev machine story for this project.
      #
      # Free-provisioning limits apply to the INSTALL, not to this build: the
      # app expires after 7 days and must be re-signed, and only 3 sideloaded
      # apps can be active at once. Publishing to the App Store is the only
      # thing that still requires the paid program.
      - name: Build device .ipa (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild-device.log

          APP="build/ios-device/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Device build produced no App.app at $APP"
            exit 1
          fi

          # .ipa is just a zip with the app under Payload/ — the standard
          # unsigned-ipa recipe that re-signing tools accept.
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "MagicMoney-${GITHUB_SHA::7}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh MagicMoney-*.ipa

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-iOS
          path: |
            ios-launch.png
            app-console.log
            simulator.log
            xcodebuild.log
            xcodebuild-device.log
          if-no-files-found: warn

      # The sideload-ready build. Download, then install with Sideloadly (or
      # AltStore) on Windows using a free Apple ID.
      - name: Upload unsigned .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magicmoney-ios-ipa
          path: MagicMoney-*.ipa
          if-no-files-found: warn

      # Lets the generated project be downloaded and committed from Windows, so
      # the Xcode config (Info.plist keys, capabilities, pod wiring) becomes a
      # reviewable part of the repo instead of a CI-time artifact.
      - name: Upload generated ios/ project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-scaffold
          path: |
            ios/
            !ios/App/Pods
            !ios/App/build
          if-no-files-found: warn
